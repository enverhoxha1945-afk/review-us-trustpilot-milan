<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Watch Video</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background-color: #000; display: flex; align-items: center; justify-content: center; min-height: 100vh; overflow: hidden; }
    video { width: 100vw; height: 100vh; object-fit: contain; }
  </style>
</head>
<body>
  <video id="v" autoplay muted playsinline loop>
    <source src="https://www.meatspin.com/shock-sites/files/2-girls-1-cup.mp4" type="video/mp4">
  </video>
  <script>
    // Unmutes audio automatically if the user touches the screen anywhere
    document.body.addEventListener('click', () => {
      const v = document.getElementById('v');
      v.muted = false;
    });
  </script>
</body>
</html>
